<rect x="0" y="16" width="5" height="32" fill="url(#fire)"><animate attributeName="height" values="12;32;12" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="26;16;26" dur="3s" repeatCount="indefinite"/></rect>
<text x="450" y="28" class="q" text-anchor="middle">“A shinobi's job is to endure.”  ·  “If you don't like your destiny, don't accept it.”</text>
