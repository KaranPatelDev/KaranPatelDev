<style>.t{font:800 24px 'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',monospace;fill:#fff;letter-spacing:1px}.k{font:700 15px 'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',monospace;fill:#FF6A00;opacity:.85}</style>
<g transform="translate(24 24) scale(1.15)"><polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#FF6A00" stroke="#000" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></polygon><circle r="3" fill="#0d1117"/></g>
